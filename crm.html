<html lang="ru" class="staff-mode">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ТЕМП · для сотрудников</title>
<link rel="stylesheet" href="css/app.css?v=20261006f">

<!-- Шрифты грузятся без блокировки: пока их нет, работает системный шрифт -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<!-- API мини-приложения Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<!-- Supabase JS SDK 2.49.4 (заказы, роли, Realtime). Файл кладёт деплой (.github/workflows/deploy.yml):
     CDN у части покупателей недоступен без VPN. Если файла нет, js/supabase.js подгрузит библиотеку с CDN. -->
<script src="js/vendor/supabase.js" defer></script>
<!-- Страница сотрудников (директор и менеджеры). Магазин для покупателей — index.html.
     Свежие версии скриптов: модули ссылаются друг на друга с ?v=20261001b, а карта подменяет адрес на новый.
     При следующем обновлении сайта достаточно поменять версию справа (и у main.js ниже) — браузер и Telegram скачают файлы заново. -->
<script type="importmap">
{
  "imports": {
    "./js/admin-analytics.js?v=20261001b": "./js/admin-analytics.js?v=20261006f",
    "./js/admin-customers.js?v=20261001b": "./js/admin-customers.js?v=20261006f",
    "./js/admin-tasks.js?v=20261001b": "./js/admin-tasks.js?v=20261006f",
    "./js/admin-reviews.js?v=20261001b": "./js/admin-reviews.js?v=20261006f",
    "./js/reviews.js?v=20261001b": "./js/reviews.js?v=20261006f",
    "./js/crm.js?v=20261001b": "./js/crm.js?v=20261006f",
    "./js/admin-dashboard.js?v=20261001b": "./js/admin-dashboard.js?v=20261006f",
    "./js/admin-export.js?v=20261001b": "./js/admin-export.js?v=20261006f",
    "./js/admin-bar-sort.js?v=20261001b": "./js/admin-bar-sort.js?v=20261006f",
    "./js/admin-orders.js?v=20261001b": "./js/admin-orders.js?v=20261006f",
    "./js/admin-products.js?v=20261001b": "./js/admin-products.js?v=20261006f",
    "./js/admin-staff.js?v=20261001b": "./js/admin-staff.js?v=20261006f",
    "./js/cart.js?v=20261001b": "./js/cart.js?v=20261006f",
    "./js/catalog.js?v=20261001b": "./js/catalog.js?v=20261006f",
    "./js/chat.js?v=20261001b": "./js/chat.js?v=20261006f",
    "./js/config.js?v=20261001b": "./js/config.js?v=20261006f",
    "./js/core.js?v=20261001b": "./js/core.js?v=20261006f",
    "./js/data.js?v=20261001b": "./js/data.js?v=20261006f",
    "./js/github.js?v=20261001b": "./js/github.js?v=20261006f",
    "./js/main.js?v=20261001b": "./js/main.js?v=20261006f",
    "./js/nav.js?v=20261001b": "./js/nav.js?v=20261006f",
    "./js/photos.js?v=20261001b": "./js/photos.js?v=20261006f",
    "./js/roles.js?v=20261001b": "./js/roles.js?v=20261006f",
    "./js/shop.js?v=20261001b": "./js/shop.js?v=20261006f",
    "./js/sort.js?v=20261001b": "./js/sort.js?v=20261006f",
    "./js/staff-access.js?v=20261001b": "./js/staff-access.js?v=20261006f",
    "./js/staff-login.js?v=20261001b": "./js/staff-login.js?v=20261006f",
    "./js/state.js?v=20261001b": "./js/state.js?v=20261006f",
    "./js/supabase.js?v=20261001b": "./js/supabase.js?v=20261006f"
  }
}
</script>

<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <h1 class="brand">ТЕМП<span class="men">MEN</span></h1>
      <div class="staff-badge" id="staffBadge" hidden></div>
    </div>
    <div class="lanes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p class="tag" id="greeting">Мужская одежда для бега, зала и улицы</p>
    <div class="admin-bar" id="adminBar" hidden>
      <button class="admin-btn" id="adminHomeButton" hidden>Главная</button>
      <button class="admin-btn" id="adminOrdersButton">Заказы</button>
      <button class="admin-btn" id="adminCustomersButton" hidden>Клиенты</button>
      <button class="admin-btn" id="adminTasksButton" hidden>Задачи</button>
      <button class="admin-btn" id="adminReviewsButton" hidden>Отзывы</button>
      <button class="admin-btn" id="adminProductsButton">Товары</button>
      <button class="admin-btn" id="adminAnalyticsButton" hidden>Аналитика</button>
      <button class="admin-btn" id="adminStaffButton" hidden>Сотрудники</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button class="tab" data-tab="cart" aria-pressed="false">Корзина<span id="cartTabCount"></span></button>
    <button class="tab" data-tab="orders" aria-pressed="false">Мои заказы</button>
    <button class="tab" data-tab="shop" aria-pressed="true">Товары</button>
  </nav>
  <div id="shopPage">
    <div class="cats-bar">
      <nav class="cats" id="categories" aria-label="Категории"></nav>
      <div class="cat-tools">
        <button class="ghost" id="hiddenProductsButton" hidden>Удалённые</button>
        <button class="primary" id="addProductButton" hidden>+ Добавить</button>
      </div>
    </div>
    <main class="grid" id="grid"></main>
  </div>
  <section class="page" id="cartPage" hidden></section>
  <section class="page" id="ordersPage" hidden></section>
</div>

<div class="cartbar" id="cartBar"><button id="cartBarButton"><span id="cartBarText">Корзина</span><span id="cartBarTotal"></span></button></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close" id="closeSheet" aria-label="Закрыть">✕</button>
  <div class="sheet-inner" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
